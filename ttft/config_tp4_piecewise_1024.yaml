# DeepSeek-V4-Flash TP4/EP4 TTFT experiment. Capture the static prefill
# segments for the single 1024-token bucket while dynamic sparse-attention and
# cache-management operators execute between captured segments.
world_size: 4

attn_backend: deepseek_v4_sparse
compile_backend: torch-cudagraph
model_factory: DeepseekV4AutoModelForCausalLM
max_batch_size: 2
max_num_tokens: 1024
max_seq_len: 2048
enable_chunked_prefill: true
cuda_graph_config:
  max_batch_size: 2
  batch_sizes: [1, 2]

transforms:
  pipeline_cache:
    enabled: false
  load_weights:
    disable_preload: true
  fuse_rmsnorm:
    rmsnorm_backend: torch
  detect_sharding:
    enabled: false
  sharding_transform_executor:
    enabled: false
  apply_sharding_hints:
    enabled: true
    allreduce_strategy: NCCL
    dist_mapping:
      tp: 4
      moe_ep: 4
      moe_tp: 1
      moe_cluster: 1
    enable_attention_dp: false
    shard_layers: ["mla", "moe"]
  fuse_finegrained_fp8_linear:
    enabled: false
  quantize_mxfp4_moe:
    enabled: true
  compile_model:
    piecewise_enabled: true
    piecewise_num_tokens: [1024]
  multi_stream_moe:
    enabled: false
