# This is the set of transforms running in "graph" mode. In this mode, we capture the full graph
# of the model and optimize it for inference.
transforms:
  ############################################################################################
  # BUILD MODEL, EXPORT TO GRAPH MODULE, AND CLEAN UP
  ############################################################################################
  build_model:
    stage: factory
    run_per_gm: false
    device: meta
    requires_clean_graph: false
  export_to_gm:
    stage: export
    clone_state_dict: false
    strict: false
    run_per_gm: false
    requires_clean_graph: false
  cleanup_noop_slice:
    stage: post_export
  cleanup_noop_add:
    stage: post_export
  cleanup_input_constraints:
    stage: post_export
  ############################################################################################
  # RUN PATTERN MATCHER TRANSFORMATIONS TO STANDARDIZE GRAPH REPRESENTATION
  ############################################################################################
  match_moe_pattern:
    stage: pattern_matcher
  match_dense_moe_pattern:
    stage: pattern_matcher
  match_bmm_moe_pattern:
    stage: pattern_matcher
  split_moe_fused_for_sharding:
    stage: pattern_matcher
  match_repeat_kv:
    stage: pattern_matcher
    run_shape_prop: true
  match_eager_attention:
    stage: pattern_matcher
    requires_shape_prop: true
  match_sdpa_to_torch_attention:
    stage: pattern_matcher
  match_grouped_attention:
    stage: pattern_matcher
  match_attention_layout:
    stage: pattern_matcher
    attn_layout: bsnd
  match_rope_pattern:
    stage: pattern_matcher
  match_rope_layout:
    stage: pattern_matcher
    expected_layout: bsnd
  match_rmsnorm_pattern:
    stage: pattern_matcher
    run_shape_prop: true
  match_l2norm_pattern:
    stage: pattern_matcher
  match_moe_routing_pattern:
    stage: pattern_matcher
  ############################################################################################
  # RUN TRANSFORMATIONS ON STANDARDIZED GRAPH REPRESENTATION
  ############################################################################################
  eliminate_redundant_transposes:
    stage: pattern_matcher
  quantize_int4_linear_from_config:
    stage: pattern_matcher
  quantize_int4_gptq_linear_from_config:
    stage: pattern_matcher
  quantize_fp8_linear_from_config:
    stage: pattern_matcher
  quantize_nvfp4_linear_from_config:
    stage: pattern_matcher
  quantize_finegrained_fp8_linear_from_config:
    stage: pattern_matcher
  quantize_finegrained_fp8_moe:
    stage: pattern_matcher
  quantize_fp8_bmm_from_config:
    stage: pattern_matcher
  quantize_fp8_from_graph:
    stage: pattern_matcher
  quantize_nvfp4_from_graph:
    stage: pattern_matcher
  # SwiGLU pattern matching must run AFTER quantization transforms. For pre-quantized
  # checkpoints (e.g., NVFP4), quantization converts torch_linear_simple ops to quantized
  # ops first, and then match_nvfp4_swiglu_pattern captures the NVFP4 SwiGLU pattern.
  # For non-quantized models, quantization transforms are no-ops, so match_swiglu_pattern
  # proceeds normally.
  match_swiglu_pattern:
    stage: pattern_matcher
    enabled: true
  match_nvfp4_swiglu_pattern:
    stage: pattern_matcher
    requires_shape_prop: true
    enabled: true
  match_finegrained_fp8_swiglu_pattern:
    stage: pattern_matcher
    requires_shape_prop: true
    enabled: true
  quantize_fp8_moe:
    stage: pattern_matcher
  quantize_nvfp4_moe:
    stage: pattern_matcher
    run_shape_prop: true
  quantize_mxfp4_moe:
    stage: pattern_matcher
  detect_hidden_states_for_capture:
    stage: pattern_matcher
    enabled: false
  detect_sharding:
    stage: sharding
    simple_shard_only: false
    sharding_dims: ['tp', 'ep', 'bmm']
    # NOTE: sharding_source applies only to TP sharding
    sharding_source: ['manual', 'factory', 'heuristic']
    support_partial_config: true

    shard_all_unprocessed: false
    enable_attention_dp: false
    allreduce_strategy: 'NCCL'
    dist_backend: auto
    requires_shape_prop: true
  sharding_transform_executor:
    stage: sharding
    run_shape_prop: true
  apply_sharding_hints:
    enabled: false
    stage: sharding
    run_shape_prop: true
    allreduce_strategy: NCCL
  pipeline_cache:
    stage: sharding
    enabled: true
    root: null
  ############################################################################################
  # MOVE MODEL AND LOAD WEIGHTS
  ############################################################################################
  strip_sharding_hints:
    stage: weight_load
  load_weights:
    stage: weight_load
    run_per_gm: false
    checkpoint_device: null
    expect_mem_change: true
  move_inputs_to_device:
    stage: weight_load
    run_per_gm: false
    expect_mem_change: true
  ############################################################################################
  # RUN POST-LOAD FUSION AND OPTIMIZATIONS
  ############################################################################################
  bake_grouped_finegrained_fp8_weight:
    stage: post_load_fusion
    # Superseded by the direct grouped block-FP8 W8A8 matmul in
    # torch_fake_quant_grouped_finegrained_fp8_linear (idea_0025): the op now consumes the FP8
    # weight directly (FP8 GEMM with in-kernel per-block scales), so pre-baking the weight to
    # BF16 would only force a wider 2-byte/elem weight read on the memory-bound decode GEMV.
    enabled: false
  # Fuse sibling quantized projections that read the same activation into one
  # concatenated GEMM + narrow views. Scoped to fake-quantized groups (fp8_only)
  # with a bounded fused output width to avoid the unrestricted fuse_gemms OOM
  # (issue #4674). On DeepSeek-V4 this merges the FineGrained-FP8 attn wq_a+wkv,
  # wq_b+indexer.wq_b, and shared-expert w1+w3 matmuls (each also drops one
  # activation-quant), collapsing CTA-starved B=1 decode GEMVs. Runs before
  # fuse_fp8_act_quant_cse / fuse_finegrained_fp8_gate_up, which then no-op on the
  # already-merged groups. Replicated bf16 GEMVs stay with fuse_replicated_bf16_linear.
  fuse_gemms_mixed_children:
    stage: post_load_fusion
    enabled: true
    fp8_only: true
    max_fused_out_features: 65536
  fuse_gemms:
    stage: post_load_fusion
    enabled: false # TODO: https://github.com/NVIDIA/TensorRT-LLM/issues/4674 this is causing OOMs
  fuse_fp4_gemms:
    stage: post_load_fusion
    enabled: false # TODO: https://github.com/NVIDIA/TensorRT-LLM/issues/4674 this is causing OOMs
  fuse_fp8_gemms:
    stage: post_load_fusion
    enabled: false # TODO: https://github.com/NVIDIA/TensorRT-LLM/issues/4674 this is causing OOMs
  fuse_fp8_linear:
    stage: post_load_fusion
    backend: trtllm
    requires_shape_prop: true
  fuse_trtllm_attn_quant_fp8:
    stage: post_load_fusion
    enabled: false
  fuse_nvfp4_linear:
    stage: post_load_fusion
    backend: trtllm
  fuse_relu2_quant_nvfp4:
    stage: post_load_fusion
    enabled: true
  fuse_nvfp4_swiglu:
    stage: post_load_fusion
  fuse_finegrained_fp8_swiglu:
    stage: post_load_fusion
  fuse_finegrained_fp8_linear:
    stage: post_load_fusion
    backend: trtllm
  # Share one block-FP8 activation quant across sibling FineGrained FP8 linears that
  # consume the same activation (e.g. DeepSeek-V4 attn wq_a+wkv, wq_b+indexer.wq_b,
  # shared-expert w1+w3). Runs AFTER fuse_finegrained_fp8_linear so it only fires on
  # the torch reference path (fuse disabled); a no-op once linears are routed to
  # trtllm/deepgemm (which quantize internally). run_shape_prop populates meta on the
  # hoisted quant + matmul nodes.
  fuse_fp8_act_quant_cse:
    stage: post_load_fusion
    run_shape_prop: true
  # Merge shared-expert gate (w1) + up (w3) sibling block-FP8 matmuls into one
  # concatenated projection + slice (the SwiGLU matcher can't span DeepSeek-V4's
  # clamp/FP32-cast nodes). Runs AFTER fuse_fp8_act_quant_cse so it collapses the two
  # shared-quant prequant matmuls into one; a no-op once linears route to trtllm/deepgemm.
  # run_shape_prop populates meta on the merged matmul + slice nodes.
  fuse_finegrained_fp8_gate_up:
    stage: post_load_fusion
    run_shape_prop: true
  # DeepSeek-V4-only optimization. The matcher proves the complete fused wq_a+wkv
  # projection shape and Q1024/KV(448+64) fanout, then replaces only the Q-LoRA BF16
  # torch_rmsnorm decomposition with one fixed-BF16 kernel. Projection and KV behavior
  # are unchanged. The exact DSV4 op provenance makes this a no-op for other models,
  # so no model- or campaign-specific flag is needed.
  fuse_deepseek_v4_q_rmsnorm:
    stage: post_load_fusion
    run_shape_prop: true
  # Merge sibling replicated (tp_mode="none") bf16 linear projections that read the same
  # activation into one multi-output projection + narrow slices (e.g. DeepSeek-V4 sparse
  # layers: attn/indexer compressor wkv+wgate and indexer weights_proj all read the layer
  # hidden_states). Collapses several CTA-starved M=1 decode GEMVs (and their split-K
  # reduces) into one. Scoped to small replicated weights to avoid the model-wide
  # fuse_gemms OOM. run_shape_prop populates meta on the merged matmul + narrow nodes.
  fuse_replicated_bf16_linear:
    stage: post_load_fusion
    run_shape_prop: true
  fuse_mxfp4_moe:
    stage: post_load_fusion
    expect_mem_change: true  # adds padding for trtllm-gen kernel alignment during weight repack
  # Fold the EP global->local routing localization into the DSV4 router gate
  # kernels (drops one deepseek_v4_localize_routing launch per MoE layer per
  # decode step on the trtllm-gen MXFP4 path). Bit-exact; SM100f-gated.
  fuse_moe_routing_localization:
    stage: post_load_fusion
  fuse_moe:
    stage: post_load_fusion
    expect_mem_change: true
    backend: trtllm
  fuse_fp8_moe:
    stage: post_load_fusion
    expect_mem_change: true
    backend: trtllm
    allow_different_input_scales: false
  fuse_finegrained_fp8_moe:
    stage: post_load_fusion
    expect_mem_change: true
    allow_different_input_scales: false
  fuse_nvfp4_moe:
    stage: post_load_fusion
    expect_mem_change: true
    allow_different_input_scales: false
    backend: cutlass
  fuse_collinear_allreduce:
    stage: post_load_fusion
    requires_shape_prop: true
  # Fold the merge add feeding a distributed all_reduce into the producing
  # bias-free block-FP8 linear's epilogue (one kernel writes the collective's
  # input buffer directly, bit-exact). Runs AFTER fuse_collinear_allreduce,
  # which creates the canonical match: DeepSeek-V4's per-MoE-layer
  # ``AR(routed_moe_out + shared_down_proj_out)`` seam.
  fuse_fp8_linear_allreduce_add:
    stage: post_load_fusion
    requires_shape_prop: true
  # Fuse the clamped-SwiGLU + down-input act-quant chain between a merged block-FP8
  # gate/up projection and its down projection (DeepSeek-V4 shared experts: the
  # generic SwiGLU matcher cannot span the clamp/FP32-cast nodes) into one Triton
  # kernel feeding the matmul-only prequant down linear. Bit-exact. Runs AFTER
  # fuse_fp8_linear_allreduce_add so the down projection is matched in its final
  # (residual-add) form and that fusion's collective-input epilogue is preserved.
  fuse_fp8_swiglu_act_quant:
    stage: post_load_fusion
    run_shape_prop: true
  fuse_allreduce_residual_rmsnorm:
    stage: post_load_fusion
    requires_shape_prop: true
  fuse_rmsnorm:
    stage: post_load_fusion
    rmsnorm_backend: flashinfer
    gated_rmsnorm_backend: triton
    requires_shape_prop: true
  fuse_rmsnorm_quant_nvfp4:
    stage: post_load_fusion
    enabled: true
  fuse_gdn_gating:
    stage: post_load_fusion
  fuse_l2norm:
    stage: post_load_fusion
    backend: fla
  fuse_silu_mul:
    stage: post_load_fusion
    enabled: true
    backend: flashinfer
  fuse_swiglu:
    stage: post_load_fusion
    enabled: false
  fuse_add_rms_norm:
    stage: post_load_fusion
    enabled: false
  fuse_rmsnorm_quant_fp8:
    stage: post_load_fusion
    enabled: false
  gather_logits_before_lm_head:
    stage: post_load_fusion
    # TODO: fix https://github.com/NVIDIA/TensorRT-LLM/issues/9878 to enable by default
    enabled: false
  # fuse_rope_into_trtllm_attention runs BEFORE optimize_rope, matching
  # torch_rope_* IR ops directly (not flashinfer_rope).  Both are at
  # post_load_fusion (after weight_load) so buffers are real tensors.
  # DCE after fuse_rope removes dead rope nodes; optimize_rope then
  # handles remaining torch_rope_* for non-trtllm backends.
  fuse_rope_into_trtllm_attention:
    stage: post_load_fusion
    enabled: false
  fuse_rope_into_trtllm_mla:
    stage: post_load_fusion
    enabled: false
  optimize_rope:
    stage: post_load_fusion
  mlir_elementwise_fusion:
    stage: post_load_fusion
    enabled: false
    run_shape_prop: false
    bypass_ops: []
  ############################################################################################
  # VISUALIZE GRAPH
  ############################################################################################
  visualize_namespace:
    stage: visualize
    enabled: false
  ###########################################################################################
  # SWITCH TO CACHED+FLATTENED ATTENTION + INITIALIZE CACHES
  ###########################################################################################
  insert_cached_attention:
    stage: cache_init
    backend: trtllm
  insert_cached_mla_attention:
    stage: cache_init
    requires_shape_prop: true
    backend: flashinfer_mla
  insert_cached_ssm_attention:
    stage: cache_init
    backend: triton_ssm
  insert_cached_causal_conv:
    stage: cache_init
    backend: cuda_causal_conv
  insert_cached_delta_rule:
    stage: cache_init
    backend: fla_delta
  insert_cached_gated_delta_rule:
    stage: cache_init
    backend: fla_gated_delta
    enabled: true
  insert_cached_residual_add:
    stage: cache_init
    backend: cached_residual_add
  initialize_mrope_delta_cache:
    stage: cache_init
    run_per_gm: false
    enabled: false
  initialize_cache:
    stage: cache_init
    expect_mem_change: true
    run_per_gm: false
  resize_kv_cache:
    stage: cache_init
    expect_mem_change: true
    run_per_gm: false
  ############################################################################################
  # COMPILE MODEL
  ############################################################################################
  fuse_causal_conv_activation:
    stage: compile
  multi_stream_moe:
    stage: compile
    enabled: false
  # DSV4-scoped default enablement of the shared/routed MoE overlap: the op
  # allowlist restricts the rewrite to the from-routing MXFP4 ops that only the
  # DeepSeek-V4 modeling code emits, so other models keep single-stream MoE.
  multi_stream_moe_from_routing:
    stage: compile
    enabled: true
    op_allowlist:
      - torch_mxfp4_moe_from_routing
      - torch_mxfp4_moe_from_routing_ep
  multi_stream_mla_attn:
    stage: compile
    enabled: false
  multi_stream_gemm:
    stage: compile
    enabled: false
  cleanup_identity_dtype_cast:
    stage: compile
    enabled: false
  compile_model:
    stage: compile
    expect_mem_change: true
    run_per_gm: false
    backend: torch-cudagraph
    piecewise_enabled: true
    piecewise_num_tokens: null
