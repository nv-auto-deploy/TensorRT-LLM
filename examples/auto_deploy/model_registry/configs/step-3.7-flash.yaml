# Self-contained AutoDeploy config for StepFun Step-3.7-Flash (text decoder).
#
# Step-3.7-Flash is a vision-language model; AutoDeploy onboards the text generation
# path (model_type step3p7 / text config step3p5). The custom modeling code lives in
# tensorrt_llm/_torch/auto_deploy/models/custom/modeling_step3p7.py and is selected by
# registering Step3p7ForCausalLM under the Step3p7Config config class.
#
# 45 decoder layers (3 dense + 42 MoE, 288 routed experts top-8 + shared expert),
# GQA with mixed full/sliding attention and a head-wise attention gate. BF16 weights.
runtime: trtllm
compile_backend: torch-cudagraph
model_factory: AutoModelForCausalLM
attn_backend: flashinfer  # was: flashinfer  (debug: FI isolation test)
max_seq_len: 8192
max_num_tokens: 8192
max_batch_size: 128
world_size: 8
enable_chunked_prefill: true
cuda_graph_config:
  batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128]
kv_cache_config:
  dtype: bfloat16
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.7
  tokens_per_block: 64
model_kwargs:
  torch_dtype: bfloat16
# Hint-driven sharding IR: the modeling code carries explicit sharding hints
# (tp_mode / layer_type / tp_scaled_dim / all_reduce), so disable the legacy
# heuristic sharding and apply the hints instead.
transforms:
  detect_sharding:
    enabled: false
  sharding_transform_executor:
    enabled: false
  apply_sharding_hints:
    enabled: true
    # TP8 batch=1 decode: ~2 all_reduces/layer x45 layers on the critical path,
    # each ~1 token (~14KB). Default NCCL ring latency is fixed-overhead bound for
    # tiny msgs; AUTO routes through trtllm::tunable_allreduce which autotunes and
    # picks the fastest NVLink one-shot/min-latency kernel per message size.
    # Numerics-safe (bit-faithful sum; NOT LOWPRECISION). Consumed by
    # init_dist_config -> DistConfig -> all_reduce op args (sharding_ir.py).
    allreduce_strategy: AUTO
  gather_logits_before_lm_head:
    enabled: true
  # Consolidate projections that share hidden_states into one GEMM at
  # post_load_fusion (after per-rank sharding): attention q/k/v(/g) and the
  # bf16 SwiGLU gate/up (dense MLP + MoE shared expert). Reference-safe
  # concatenated matmul + narrow split. No conflict with multi_stream_gemm
  # (FP8-only; attention/dense linears here are bf16, so multi_stream_gemm
  # matches 0 in this model).
  fuse_gemms_mixed_children:
    enabled: true
  # Overlap the bf16 shared-expert MLP with the FP8 routed grouped-GEMM on an
  # auxiliary CUDA stream. Step has a shared expert on all 42 MoE layers; the merge
  # node `self.moe(h) + self.share_expert(h)` (modeling_step3p7.py:650, one per MoE
  # layer) is exactly the routed+shared add that MultiStreamMOE rewrites — it traces
  # the shared-expert subgraph (fused gate/up GEMM -> silu_mul -> down GEMM) and runs
  # it via begin/end/wait_aux_stream so it overlaps the routed
  # trtllm_quant_finegrained_fp8_moe_fused op. At TP8/batch=1 decode both kernels
  # under-occupy the SMs (same launch/occupancy-bound regime as idea_0013), so
  # concurrent execution recovers idle SM cycles. Pure stream scheduling with a
  # main-stream wait before the merge -> numerics-safe. Off-by-default
  # (default.yaml:312-314); not overridden elsewhere for this model.
  multi_stream_moe:
    enabled: true
